<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <script src="script.js"></script>
  
<div class="container">
  <div id="root1"></div> <!-- React will mount here -->
  <main class="main-content">
    <div id="root2"></div> <!-- React will mount here -->
    <section class="dashboard">
      <h2>Overview</h2>
      <div id="root3"></div> <!-- React will mount here -->
      <div id="root4"></div> <!-- React will mount here -->
    </section>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

 <!-- Sample -->
  <script type="text/babel">
    function App() {
      return <h1>Hello from React!</h1>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <!-- Sidebar -->
  <script type="text/babel">
    function Sidebar() {
      return <aside class="sidebar">
            <div class="logo">
                <h2>Admin Dashboard</h2>
            </div>
            <nav>
                <ul>
                    <li><a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Users</a></li>
                    <li><a href="#"><i class="fas fa-chart-bar"></i> Analytics</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root1'));
    root.render(<Sidebar />);
  </script>
  
  <!-- Header -->
  <script type="text/babel">
    function Header() {
      return <header>
                <div class="header-left">
                    <i class="fas fa-bars toggle-btn"></i>
                    <h3>Welcome, Admin</h3>
                </div>
                <div class="header-right">
                    <i class="fas fa-user"></i>
                    <span>Logout</span>
                </div>
            </header>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root2'));
    root.render(<Header />);
  </script>
  
  <!-- Dashboard Content -->
  <script type="text/babel">
    function Card() {
      return <div class="card-container">
                    <div class="card">
                        <h3>A</h3>
                        <p>1,234</p>
                    </div>
                    <div class="card">
                        <h3>B</h3>
                        <p>$12,345</p>
                    </div>
                    <div class="card">
                        <h3>C</h3>
                        <p>567</p>
                    </div>
                    <div class="card">
                        <h3>D</h3>
                        <p>8,910</p>
                    </div>
                </div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root3'));
    root.render(<Card />);
  </script>
  
  <!-- Table -->
  <script type="text/babel">
    function Table() {
      
      return <div class="table-container">
      <script src="script.js"></script>
                    <div class="card">
      <h2>Candidate Applications</h2>
      <table>
        <thead>
          <tr>
            <th>Candidate ID</th>
            <th>Name</th>
            <th>Application Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="candidateTable">
          <tr><td colspan="4" class="text-center">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
                </div>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root4'));
    root.render(<Table />);
  </script>
  
  
</div> 
</body>
</html>
